services:
  # ── API ───────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - llm-network
    restart: unless-stopped

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: llm-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: llm_user
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: llm_api
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_user -d llm_api"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - llm-network
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: llm-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    networks:
      - llm-network
    restart: unless-stopped

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  llm-network:
    driver: bridge

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
